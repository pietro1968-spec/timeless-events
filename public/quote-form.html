<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>Richiesta preventivo</title>
</head>
<body>
  <form
    name="quote-request"
    method="POST"
    data-netlify="true"
  >
    <input type="hidden" name="form-name" value="quote-request" />

    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="tel" name="phone" />
    
    <select name="eventType">
      <option value="Matrimonio">Matrimonio</option>
      <option value="Battesimo">Battesimo</option>
      <option value="Comunione">Comunione</option>
      <option value="Compleanno">Compleanno</option>
      <option value="Evento aziendale">Evento aziendale</option>
      <option value="Altro">Altro</option>
    </select>

    <input type="date" name="date" />
    <input type="text" name="city" />
    <input type="text" name="guests" />
    <textarea name="message"></textarea>
    <input type="checkbox" name="privacy" value="yes" />
  </form>
</body>
</html>
